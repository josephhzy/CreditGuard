services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data/raw:/app/data/raw:ro
      - ../data/processed:/app/data/processed:ro
      - ../mlruns:/app/mlruns:ro
    # .env is optional — defaults in code match .env.example. Copy
    # .env.example to .env at the repo root to override.
    env_file:
      - path: ../.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlruns
    # Local dev only — MLflow has no built-in auth. Do not expose port 5000
    # to a shared network or public interface.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root /mlruns/artifacts

